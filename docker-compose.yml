services:
  app:
    build: .
    init: true
    ports:
      - "3000:3000"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env first}
      REDIS_URL: redis://redis:6379
      OUTPUT_DIR: /app/output
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      BODY_LIMIT: ${BODY_LIMIT:-1048576}
      BATCH_LIMIT: ${BATCH_LIMIT:-100}
    volumes:
      - documents:/app/output
    shm_size: 256mb
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  documents:
  redis-data:
