<!doctype html>
<html lang="id">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>DocForge · Editor overlay</title
  ><style>
    body {
      font: 16px system-ui;
      max-width: 1100px;
      margin: 30px auto;
      padding: 15px;
      color: #183e61;
    }
    button,
    input,
    select {
      font: inherit;
      padding: 8px;
      margin: 4px;
    }
    #stage {
      position: relative;
      display: inline-block;
      max-width: 100%;
      border: 1px solid #abc;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .field {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid #b45c00;
      background: #ffde8a66;
      overflow: hidden;
      pointer-events: none;
      font-size: 12px;
    }
    label {
      display: inline-block;
    }
    textarea {
      width: 100%;
      height: 180px;
    }
    #status {
      color: #963800;
    }
  </style>
  <a href="/">← Kembali ke DocForge</a>
  <h1>Editor overlay</h1>
  <p>
    Ingin mengekspor fungsi TypeScript dari PDF?
    <a href="/converter">Buka PDF ke kode ↗</a>
  </p>
  <p>
    Unggah PDF atau PNG lokal, lalu klik pratinjau untuk menambah field.
    Koordinat dari kiri atas dalam persen. Background tidak dikirim ke server.
    Untuk PDF, pilih halaman sebelum menambah field.
  </p>
  <input type="file" id="file" accept="application/pdf,image/png" /><label
    >Halaman
    <input
      id="page"
      type="number"
      value="1"
      min="1"
      style="width: 60px" /></label
  ><button id="show">Tampilkan</button>
  <p id="status" role="status"></p>
  <div>
    <label>Key <input id="key" value="nama" /></label
    ><label
      >Lebar %
      <input
        id="width"
        type="number"
        value="40"
        min="1"
        max="100"
        style="width: 60px" /></label
    ><label
      >Tinggi %
      <input
        id="height"
        type="number"
        value="10"
        min="1"
        max="100"
        style="width: 60px" /></label
    ><label>Font <input id="font" value="Helvetica" /></label
    ><label
      >Ukuran pt
      <input
        id="size"
        type="number"
        value="24"
        min="1"
        style="width: 60px" /></label
    ><label>Warna <input id="color" type="color" value="#172b4d" /></label
    ><select id="align">
      <option>left</option>
      <option>center</option>
      <option>right</option></select
    ><label><input id="wrap" type="checkbox" checked />Wrap</label
    ><label><input id="shrink" type="checkbox" checked />Auto-shrink</label>
  </div>
  <div id="stage"><canvas id="canvas"></canvas></div>
  <p>
    <button id="undo">Hapus terakhir</button
    ><button id="export">Ekspor fields.json</button>
  </p>
  <textarea id="json" readonly aria-label="fields.json"></textarea>
  <script type="module" src="/editor.js"></script>
</html>
