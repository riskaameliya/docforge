<!doctype html>
<html lang="id">
  <meta charset="UTF-8" /><style>
    body {
      font-family: Arial, sans-serif;
      font-size: 11pt;
      color: #19374c;
      overflow-wrap: anywhere;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    thead {
      display: table-header-group;
    }
    tr {
      break-inside: avoid;
    }
    th,
    td {
      border: 1px solid #b9c8d1;
      padding: 9px;
      text-align: left;
      overflow-wrap: anywhere;
    }
    th {
      background: #dceaf1;
    }
    h1 {
      font-size: 24pt;
    }
  </style>
  <h1>{{judul}}</h1>
  <p>Tanggal: {{tanggal}}</p>
  <table>
    <thead>
      <tr>
        <th>Nama</th>
        <th>Jumlah</th>
        <th>Keterangan</th>
      </tr>
    </thead>
    <tbody>
      {{#each items}}
      <tr>
        <td>{{nama}}</td>
        <td>{{jumlah}}</td>
        <td>{{#if keterangan}}{{keterangan}}{{else}}—{{/if}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
</html>
